<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandru - Creare Site-uri</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        .lang-section {
            margin-bottom: 25px;
        }
        .lang-badge {
            display: inline-block;
            background-color: #e0e7ff;
            color: #3730a3;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        h1 {
            color: #2c3e50;
            margin-top: 0;
            font-size: 24px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
        }
        a {
            color: #3498db;
            font-weight: bold;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .divider {
            border: 0;
            height: 1px;
            background: #eee;
            margin: 30px 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- РУМЫНСКИЙ БЛОК -->
        <div class="lang-section">
            <span class="lang-badge">🇲🇩 RO/MD</span>
            <h1>Bună! Sunt Alexandru.</h1>
            <p>Realizez site-uri de prezentare pentru afaceri mici.</p>
            <p>Portofoliu: <a href="https://alexmadan.github.io/Frosimport/" target="_blank">Site Frosimport</a></p>
        </div>

        <hr class="divider">

        <!-- РУССКИЙ БЛОК -->
        <div class="lang-section">
            <span class="lang-badge">🇷🇺 RU</span>
            <h1>Привет! Я Александр.</h1>
            <p>Делаю сайты-визитки для малого бизнеса.</p>
            <p>Мои работы: <a href="https://alexmadan.github.io/Frosimport/" target="_blank">Сайт Frosimport</a></p>
        </div>
    </div>

</body>
</html>
